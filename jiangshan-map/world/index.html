<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>江山时序 · 世界历史地图</title>
  <link rel="canonical" href="https://seasand1024.github.io/jiangshan-map/world/" />
  <meta name="description" content="江山时序的世界历史断面。墨卡托投影，宣纸设色。从公元前3000年到2010年，大事落在事发地点。" />
  <meta name="theme-color" content="#f3eee4" />
  <link rel="icon" href="../assets/favicon.svg" />
  <link rel="stylesheet" href="css/world.css" />
</head>
<body>
  <div id="atlas-shell">
    <header id="nav-bar">
      <h1>
        <a class="home-link" href="../" title="回到中国历代细图"><span class="seal">江山时序</span></a>
        <span class="subtitle">世界历史地图 · 前3000 → 2010</span>
      </h1>
      <div class="tools">
        <div class="views" id="views" role="group" aria-label="地图范围">
          <button type="button" data-view="world" class="active">世界</button>
          <button type="button" data-view="med">地中海</button>
          <button type="button" data-view="europe">欧洲</button>
          <button type="button" data-view="eastasia">东亚</button>
          <button type="button" data-view="indianocean">印度洋</button>
          <button type="button" data-view="americas">美洲</button>
        </div>
        <label class="search">
          <span class="sr">搜索</span>
          <input id="q" type="search" placeholder="搜政权、城市" autocomplete="off" />
        </label>
        <div id="results" class="results" hidden></div>
      </div>
    </header>

    <main id="stage">
      <canvas id="map" aria-label="世界历史地图"></canvas>
      <div id="tip" class="tip" hidden></div>
      <aside id="panel" class="card">
        <p class="year" id="year-label">—</p>
        <p class="era" id="era-title"></p>
        <section id="picked" class="picked" hidden></section>
        <p id="story"></p>
        <p id="caveat" class="caveat" hidden></p>
        <h2>大事</h2>
        <ol id="events" class="events"></ol>
        <h2>图上政权</h2>
        <div id="legend" class="legend"></div>
        <p id="counts" class="counts"></p>
        <div class="toggles">
          <label><input type="checkbox" id="toggle-culture" /> 部族与文化区</label>
          <label><input type="checkbox" id="toggle-cities" checked /> 城市</label>
        </div>
        <p class="source" id="source"></p>
      </aside>
    </main>

    <footer class="timeline">
      <div class="time-row">
        <button type="button" id="prev" aria-label="上一个断面">上一断面</button>
        <button type="button" id="play" aria-pressed="false">播放</button>
        <button type="button" id="next" aria-label="下一个断面">下一断面</button>
        <p class="hint">方向键换断面，空格播放。点朱点或大事，镜头移到事发地。</p>
      </div>
      <div id="chips" class="chips" role="tablist" aria-label="历史断面"></div>
    </footer>
  </div>
  <script src="js/world.js"></script>
</body>
</html>
